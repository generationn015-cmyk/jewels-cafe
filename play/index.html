<!DOCTYPE html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Jewel's Cafe</title><meta name=apple-mobile-web-app-capable content=yes><meta name=theme-color content=#ff7a00><meta http-equiv=Cache-Control content="no-cache, no-store, must-revalidate"><style>*{box-sizing:border-box}html,body{margin:0;height:100dvh;overflow:hidden;background:#3a2214;font-family:Trebuchet MS,system-ui}#app{height:100dvh;width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:#5a3218}#hud{display:flex;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 8px}.chip{background:#0008;color:#fff;border:2px solid #fff5;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px}#sign{text-align:center;color:#fff;font-weight:900}#window{flex:0 0 42%;min-height:220px;position:relative;background:url(https://jewels-cafe.netlify.app/kitchen.jpg) center 40%/cover}#slots{position:absolute;inset:8px;display:flex;justify-content:center;align-items:flex-end}.ticket{width:min(260px,88%);background:#fff6d0;border:2px solid #c9a24a;border-radius:10px;padding:12px 8px;font-size:14px;font-weight:800;color:#2a1a12}.who{height:140px;animation:idle .7s ease-in-out infinite}.who img{height:140px;display:block;margin:0 auto}.who.in{animation:walkIn 1.1s linear, idle .7s ease-in-out 1.1s infinite}@keyframes idle{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,-8px)}75%{transform:translate(3px,-8px)}}@keyframes walkIn{0%{transform:translate(130px,0);opacity:0}100%{transform:translate(0,0);opacity:1}}#counter{flex:1;padding:8px;display:flex;flex-direction:column;color:#fff;background:linear-gradient(#6a3a1c,#3a2214)}#chefWrap{position:absolute;left:10px;bottom:8px}#chefWrap img{height:90px;animation:idle .8s ease-in-out infinite}#coach{background:#fff3c4;color:#2a1a12;border:2px solid #c9844a;border-radius:12px;padding:8px;font-weight:800;font-size:13px;margin:6px 0}#menu{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:auto;flex:1}.dish{border:3px solid #3a2214;border-radius:14px;min-height:46px;font-weight:900;font-size:11px;background:linear-gradient(#fff,#ffd56a)}.dish.on{background:#ffb703}.ov{position:absolute;inset:0;background:#1a0d08f0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}.ov[hidden]{display:none!important}.card{background:#fff7e8;width:100%;max-height:90%;overflow:auto;border:4px solid #3a2214;border-radius:22px;padding:16px}.btn{width:100%;border:3px solid #3a2214;background:#ff7a00;color:#fff;font-weight:900;font-size:16px;padding:12px;border-radius:16px;margin-top:8px}.btn.alt{background:#1f8bb8}.btn.ghost{background:#fff;color:#1f8bb8}.paused{position:absolute;inset:0;background:#000c;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900;gap:16px}.paused[hidden]{display:none!important}.paused .btn{width:80%}input.nm{width:100%;border:3px solid #3a2214;border-radius:12px;padding:12px;font-size:16px;font-weight:800;font-family:inherit}.booth{text-align:left;padding:10px}.row{display:flex;justify-content:center;gap:8px}.row img{height:72px;animation:idle .7s ease-in-out infinite}.tiny{font-size:12px;font-weight:800;color:#7a4a20}</style></head><body><div id=app><div id=hud><div class=chip id=hCh>1A</div><div class=chip id=hMoney>$0</div><div class=chip id=hLife>*</div><div class=chip id=hMenu>Menu</div></div><div id=sign>JEWEL'S CAFE</div><div id=window><div id=chefWrap><img src=https://jewels-cafe.netlify.app/chef.png alt=chef></div><div id=slots></div></div><div id=counter><div>Holding: <b id=heldName>nothing</b></div><div id=coach>Read the ticket. Cook the word. Serve.</div><div id=menu></div><button class=btn id=btnServe type=button>Serve</button></div><div class=paused id=paused hidden><div style=font-size:22px>PAUSED</div><button class=btn id=btnResume type=button>Resume rush</button></div><div class=ov id=boot><div class=card><h2>Jewel's Cafe</h2><p class=tiny>Discovering Statistics 3e. Chapters 1-14</p><div class=row><img src=https://jewels-cafe.netlify.app/chef.png alt=''><img src=https://jewels-cafe.netlify.app/cust1.png alt=''><img src=https://jewels-cafe.netlify.app/cust3.png alt=''></div><p>One customer. Cook the word. Serve.</p><button class=btn id=btnPlay type=button onclick="document.getElementById('boot').hidden=true;document.getElementById('profile').hidden=false">New game</button><button class='btn alt' id=btnCont hidden type=button>Continue</button><button class='btn ghost' id=btnPick type=button>Chapter map</button></div></div><div class=ov id=profile hidden><div class=card><h2>Who is cooking?</h2><input class=nm id=pName maxlength=18 placeholder='Chef name'><button class=btn id=btnSaveProf type=button>Clock in</button></div></div><div class=ov id=teach hidden><div class=card><div class=tiny id=teachK></div><h2 id=teachT>Kitchen</h2><p id=teachB></p><button class=btn id=teachGo type=button>Start rush</button><button class='btn ghost' id=teachMenu type=button>Map</button></div></div><div class=ov id=pick hidden><div class=card><h2>Chapter map</h2><div id=chList></div><button class='btn ghost' id=pickBack type=button>Back</button></div></div><div class=ov id=settings hidden><div class=card><h2>Menu</h2><button class=btn id=setPause type=button>Pause / resume</button><button class='btn ghost' id=setMap type=button>Chapter map</button><button class='btn ghost' id=setHome type=button>Title</button><button class='btn ghost' id=setClose type=button>Close</button></div></div><div class=ov id=recipe hidden><div class=card><h2>Say it 3 times</h2><p id=recLine></p><button class=btn id=nextRush type=button>Next kitchen</button></div></div></div><script src="cafe.js?v=26"></script></body></html>
